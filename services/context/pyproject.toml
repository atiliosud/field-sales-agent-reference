[project]
name = "context-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.142.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false
