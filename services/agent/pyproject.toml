    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langchain-core==1.6.7",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.7",
    "langgraph==1.2.14",
    "mcp==1.30.0",
    "openinference-instrumentation-langchain==0.1.78",
