name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.8 check .
      - run: uvx ruff@0.16.8 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [agent, mcp-sales, context]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run pytest

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait
      - run: |
          for port in 8000 8001 8002; do curl --fail --silent "http://localhost:$port/health"; done
          curl --fail --silent --output /dev/null --retry 10 --retry-connrefused --retry-delay 2 http://localhost:6006
      - if: always()
        run: docker compose down --volumes
