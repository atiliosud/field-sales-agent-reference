name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.8 check .
      - run: uvx ruff@0.16.8 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [agent, mcp-sales, context]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run pytest

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait
      - name: Check service health endpoints
        run: |
          for port in 8000 8001 8002; do curl --fail --silent --show-error "http://localhost:$port/health"; done
      - name: Check Phoenix
        run: curl --fail --silent --show-error --output /dev/null --retry 10 --retry-connrefused --retry-delay 2 http://localhost:6006
      - if: failure()
        run: |
          curl -sv -o /dev/null http://localhost:6006 || true
          curl -sv -o /dev/null http://127.0.0.1:6006 || true
          docker compose ps
          docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes
