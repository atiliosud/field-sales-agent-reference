[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/agent", "services/mcp-sales", "services/context", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
pythonpath = ["services/agent", "services/mcp-sales", "services/context", "scripts"]
